version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: architect_secure_db
    environment:
      POSTGRES_USER: secure_admin
      POSTGRES_PASSWORD: SuperSecretPassword2026!
      POSTGRES_DB: user_store
    ports:
     - "5432:5432"
    volumes:
     - pgdata:/var/lib/postgresql/data
    networks:
      - backend_network

  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: architect_api_gateway
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://secure_admin:SuperSecretPassword2026!@localhost:5432/user_store
      - JWT_SECRET=2026_Architect_Ultra_Secret_Signing_Key_Do_Not_Leak
    depends_on:
      - postgres_db
    networks:
      - backend_network

volumes:
  pgdata:

networks:
  backend_network:
    driver: bridge